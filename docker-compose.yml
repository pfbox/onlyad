services:
  postgres:
    image: postgres:16-alpine
    container_name: onlyad-postgres
    environment:
      POSTGRES_USER: onlyad
      POSTGRES_PASSWORD: onlyad
      POSTGRES_DB: onlyad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
